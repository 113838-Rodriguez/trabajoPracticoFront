
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empleados - Ferretería Tronka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/empleados.css">
</head>

<body>
    <div class="app-container">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <i class="bi bi-tools"></i>
                <h4>Ferretería Tronka</h4>
            </div>

            <nav class="nav flex-column">

                <a href="../Principal/index.html" class="nav-link">
                    <i class="bi bi-house-door"></i> Inicio
                </a>

                <a href="../Productos/Productos.html" class="nav-link">
                    <i class="bi bi-box-seam"></i> Productos
                </a>

                <a href="../Clientes/Clientes.html" class="nav-link">
                    <i class="bi bi-people"></i> Clientes
                </a>

                <a href="../Reportes/Reportes.html" class="nav-link">
                    <i class="bi bi-bar-chart-line"></i> Reportes
                </a>

                <a href="../Configuracion/Configuracion.html"
                   class="nav-link active menu-admin"
                   style="display: none;">
                    <i class="bi bi-gear"></i> Configuración
                </a>

            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-area">

            <header class="topbar">
                <h5 class="mb-0">Gestión de empleados</h5>

                <a href="../Configuracion/Configuracion.html"
                   class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                    Volver a configuración
                </a>
            </header>

            <main class="content">

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                    <div>
                        <h3>Empleados del sistema</h3>
                        <p class="text-muted mb-0">
                            Consultá y administrá los empleados registrados.
                        </p>
                    </div>

                    <a href="../Configuracion/crearEmpleado.html"
                       class="btn btn-primary"
                       id="btnNuevoEmpleado">
                        <i class="bi bi-person-plus"></i>
                        Nuevo empleado
                    </a>

                </div>

                <!-- MENSAJES -->
                <div id="mensajeError"
                     class="alert alert-danger d-none"
                     role="alert">
                </div>

                <!-- LISTADO -->
                <div class="card shadow-sm empleados-card">

                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0">
                            <i class="bi bi-people me-2"></i>
                            Listado de empleados
                        </h5>
                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Apellido</th>
                                        <th>DNI</th>
                                        <th>CUIL</th>
                                        <th>Fecha de ingreso</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaEmpleados">
                                    <tr>
                                        <td colspan="7"
                                            class="text-center text-muted py-4">
                                            Cargando empleados...
                                        </td>
                                    </tr>
                                </tbody>

                            </table>

                        </div>

                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="../js/permisos.js"></script>
    <script src="../js/empleados.js"></script>

</body>
</html>
