
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear empleado - Ferretería Tronka</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/crearEmpleado.css">
</head>

<body>

    <div class="container mt-5">

        <!-- ENCABEZADO -->
        <div class="mb-4">
            <h2>
                <i class="bi bi-person-badge text-primary"></i>
                Crear empleado
            </h2>

            <p class="text-muted">
                Configuración / Crear empleado
            </p>

            <a href="configuracion.html"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
                Volver a configuración
            </a>
        </div>

        <!-- FORMULARIO -->
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h5 class="mb-2">Datos del empleado</h5>

                <p class="text-muted mb-4">
                    Completá los datos para registrar un nuevo empleado.
                </p>

                <!-- MENSAJES -->
                <div id="mensaje"
                     class="alert d-none"
                     role="alert">
                </div>

                <form id="formCrearEmpleado">

                    <div class="row g-3">

                        <!-- NOMBRE -->
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   required>
                        </div>

                        <!-- APELLIDO -->
                        <div class="col-md-6">
                            <label for="apellido" class="form-label">
                                Apellido
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="apellido"
                                   required>
                        </div>

                        <!-- DNI -->
                        <div class="col-md-6">
                            <label for="dni" class="form-label">
                                DNI
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="dni"
                                   required>
                        </div>

                        <!-- CUIL -->
                        <div class="col-md-6">
                            <label for="cuil" class="form-label">
                                CUIL (opcional)
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="cuil">
                        </div>

                        <!-- FECHA INGRESO -->
                        <div class="col-md-6">
                            <label for="fechaIngreso" class="form-label">
                                Fecha de ingreso
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="fechaIngreso"
                                   required>
                        </div>

                       <!-- PUESTO -->
                        <div class="col-md-6">
                         <label for="puestoId" class="form-label">
                                Puesto
                         </label>

                         <select class="form-select" id="puestoId" required>
                             <option value="">Cargando puestos...</option>
                          </select>
                        </div>

                       <!-- SUCURSAL -->
                        <div class="col-md-6">
                             <label for="sucursalId" class="form-label">
                                     Sucursal
                              </label>

                                 <select class="form-select" id="sucursalId" required>
                                   <option value="">Cargando sucursales...</option>
                                </select>
                        </div>

                       
                    </div>

                    <!-- BOTONES -->
                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <a href="configuracion.html"
                           class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn btn-primary"
                                id="btnGuardar">
                            <i class="bi bi-check-lg"></i>
                            Guardar empleado
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../js/crearEmpleado.js"></script>

</body>
</html>
