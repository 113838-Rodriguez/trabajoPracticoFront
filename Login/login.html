<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ferretería Tronka</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%231e3a8a'><path d='M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .707.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 1 0 5.878-.851l2.654-2.617.968.968-.305.914a1 1 0 0 0 .242 1.023l3.27 3.27a.997.997 0 0 0 1.414 0l1.586-1.586a.997.997 0 0 0 0-1.414l-3.27-3.27a1 1 0 0 0-1.023-.242l-.914.305s-.671-.67-.968-.968l2.654-2.617c.28-.11.543-.266.772-.461a3 3 0 1 0-4.172-4.172l-2.617 2.654L3.793 3.793a1 1 0 0 1-.293-.707v-.071a1 1 0 0 0-.419-.814L1 0zm9.646 10.646a.5.5 0 0 1 .708 0l2.914 2.915a.5.5 0 0 1-.707.707l-2.915-2.914a.5.5 0 0 1 0-.708z'/></svg>">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-6 col-lg-4">

                <div class="login-container">

                    <h2 class="login-title">Ferretería Tronka 👋</h2>
                    <p class="login-subtitle">¡Bienvenido! Ingresá tu cuenta</p>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text"
                                   class="form-control"
                                   id="usuario"
                                   placeholder="Ingresá tu usuario"
                                   autocomplete="username"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   placeholder="Ingresá tu contraseña"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <div id="mensajeError"
                             class="alert alert-danger d-none"
                             role="alert">
                        </div>

                        <button type="submit" class="btn-login">
                            Iniciar sesión
                        </button>
                        

                    </form>
                        <!-- INICIO DE SESIÓN NFC -->
                    <div class="text-center mt-4">

                        <p class="text-muted mb-3">
                            O ingresá con tu credencial NFC
                        </p>

                        <button
                            type="button"
                            id="btnLoginNFC"
                            class="btn btn-outline-primary w-100 fw-semibold">

                            📱 Iniciar sesión con NFC
                        </button>

                        <div id="estadoNFC"
                            class="alert alert-info mt-3 d-none"
                            role="status">
                        </div>

                    </div>
                    <div class="text-center mt-3">
                        <a href="../Inicio/inicio.html" class="btn btn-outline-secondary w-100 mt-2 fw-semibold">
                            Volver a Inicio
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <script src="../js/login.js"></script>
    <script src="../js/nfc.js"></script>
</body>

</html>
