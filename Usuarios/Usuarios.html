
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - Ferretería Tronka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-2">Usuarios del sistema</h2>

                <a href="../Principal/index.html"
                   class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                    Volver al inicio
                </a>
            </div>

            <button class="btn btn-primary" id="btnNuevoUsuario">
                <i class="bi bi-plus-lg"></i>
                Nuevo usuario
            </button>

        </div>

        <div id="mensajeError" class="alert alert-danger d-none"></div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaUsuarios">
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

    <script src="../js/usuarios.js"></script>

</body>
</html>
