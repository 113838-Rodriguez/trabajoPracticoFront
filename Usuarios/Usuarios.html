
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - Ferretería Tronka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/usuarios.css">
</head>

<body>
    <div class="app-container">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-tools"></i>
                <h4>Ferretería Tronka</h4>
            </div>

            <nav class="nav flex-column">
                <a href="../Principal/index.html" class="nav-link">
                    <i class="bi bi-house-door"></i> Inicio
                </a>

                <a href="../Productos/Productos.html" class="nav-link">
                    <i class="bi bi-box-seam"></i> Productos
                </a>

                <a href="../Clientes/Clientes.html" class="nav-link">
                    <i class="bi bi-people"></i> Clientes
                </a>

                <a href="../Reportes/Reportes.html" class="nav-link">
                    <i class="bi bi-bar-chart-line"></i> Reportes
                </a>

                <a href="../Configuracion/Configuracion.html"
                   class="nav-link active menu-admin"
                   style="display: none;">
                    <i class="bi bi-gear"></i> Configuración
                </a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-area">

            <header class="topbar">
                <h5 class="mb-0">Gestión de usuarios</h5>

                <a href="../Configuracion/Configuracion.html"
                   class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                    Volver a configuración
                </a>
            </header>

            <main class="content">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3>Usuarios del sistema</h3>
                        <p class="text-muted mb-0">
                            Administración de usuarios y roles.
                        </p>
                    </div>

                    <a href="../Configuracion/CrearUsuario.html"
                       id="btnNuevoUsuario"
                       class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i>
                        Nuevo usuario
                    </a>
                </div>

                <div id="mensajeError"
                     class="alert alert-danger d-none"
                     role="alert">
                </div>

                <!-- TABLA -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0">Listado de usuarios</h5>
                    </div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Usuario</th>
                                        <th>Rol</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaUsuarios">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">
                                            Cargando usuarios...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="../js/permisos.js"></script>
    <script src="../js/usuarios.js"></script>
</body>
</html>
