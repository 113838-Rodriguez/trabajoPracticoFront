
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio - Ferretería Tronka</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>

    <div class="app-container">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <i class="bi bi-tools"></i>
                <h4>Ferretería Tronka</h4>
            </div>

            <nav class="nav flex-column">

                <a href="../Inicio/inicio.html" class="nav-link active">
                    <i class="bi bi-house-door"></i>
                    Inicio
                </a>

                <a href="#" class="nav-link">
                    <i class="bi bi-cart3"></i>
                    Ventas
                </a>

                <a href="#" class="nav-link">
                    <i class="bi bi-box-seam"></i>
                    Productos
                </a>

                <a href="#" class="nav-link">
                    <i class="bi bi-boxes"></i>
                    Stock
                </a>

                <a href="#" class="nav-link">
                    <i class="bi bi-people"></i>
                    Clientes
                </a>

                <a href="#" class="nav-link">
                    <i class="bi bi-truck"></i>
                    Proveedores
                </a>

                <a href="../Reportes/Reportes.html" class="nav-link admin-only">
                    <i class="bi bi-bar-chart"></i>
                    Reportes
                </a>

                <a href="../Configuracion/Configuracion.html" class="nav-link admin-only">
                    <i class="bi bi-gear"></i>
                    Configuración
                </a>

            </nav>

        </aside>

        <!-- ÁREA PRINCIPAL -->
        <div class="main-area">

            <!-- BARRA SUPERIOR -->
            <header class="topbar">

                <h5 class="mb-0">Panel principal</h5>

                <div class="user-info">

                    <i class="bi bi-person-circle"></i>

                    <span id="usuarioActual"></span>

                    <button id="btnLogout"
                            class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar sesión
                    </button>

                </div>

            </header>

            <!-- CONTENIDO -->
            <main class="content">

                <h3>Bienvenido a Ferretería Tronka</h3>

                <p class="text-muted">
                    Sistema de gestión de ferretería
                </p>

                <div class="row g-4 mt-3">

                    <!-- VENTAS -->
                    <div class="col-12 col-sm-6 col-xl-3 admin-only">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-currency-dollar"></i>
                            </div>
                            <p>Ventas del día</p>
                            <h3>—</h3>
                        </div>
                    </div>

                    <!-- PRODUCTOS -->
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <p>Productos</p>
                            <h3>—</h3>
                        </div>
                    </div>

                    <!-- STOCK -->
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-exclamation-triangle"></i>
                            </div>
                            <p>Stock bajo</p>
                            <h3>—</h3>
                        </div>
                    </div>

                    <!-- CLIENTES -->
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-people"></i>
                            </div>
                            <p>Clientes</p>
                            <h3>—</h3>
                        </div>
                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="../js/index.js"></script>

</body>
</html>
